<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duda Demo - Portfólio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Duda Demo</h1>
    <nav><a href="#about">Sobre</a> <a href="#projects">Projetos</a></nav>
  </header>
  <main>
    <section id="about">
      <h2>Sobre mim</h2>
      <p>Oi! Eu sou a Duda, uma aluna fictícia que está aprendendo a criar sites.</p>
      <img src="https://placehold.co/160x160" alt="Foto de exemplo da Duda">
    </section>
    <section id="projects">
      <h2>Projetos</h2>
      <ul>
        <li><a href="https://example.com/projeto-1">Meu primeiro site</a></li>
        <li><a href="https://example.com/projeto-2">Jogo da velha</a></li>
      </ul>
    </section>
  </main>
  <footer><p id="recado">Feito pela Duda Demo</p><button id="botao">Dizer oi</button></footer>
<script>
  const botao = document.querySelector('#botao');
  botao.addEventListener('click', () => {
    document.querySelector('#recado').style.color = '#3fd17f';
  });
</script>
</body>
</html>
